experiment_name: desire_default
output_dir: outputs

environment:
  grid_size: 20
  max_steps: 1000
  initial_energy: 150.0
  max_energy: 150.0
  energy_decay_rate: 0.3
  local_view_size: 5
  mode: baseline
  render_mode: null

agent:
  agent_type: all
  learning_rate: 0.0003
  gamma: 0.99
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.01
  planning_horizon: 3
  num_states: 100
  policy_precision: 4.0
  hidden_sizes:
    - 64
    - 64

training:
  total_timesteps: 500000
  eval_freq: 10000
  n_eval_episodes: 10
  save_freq: 10000
  log_freq: 1000
  seed: 42
  device: auto
  checkpoint_keep_last: 5
  resume_from: null

test:
  n_trials: 10
  baseline_episodes: 50
  test_episodes: 50
  warmup_steps: 100
  blockage_step: 100
  post_blockage_steps: 200
  training_episodes: 100
  transfer_episodes: 50
