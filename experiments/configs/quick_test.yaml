# Quick test configuration for rapid iteration
# Use this for debugging and initial testing

experiment_name: desire_quick_test
output_dir: outputs

environment:
  grid_size: 15  # Smaller grid for faster episodes
  max_steps: 200
  initial_energy: 150.0
  max_energy: 150.0
  energy_decay_rate: 0.3
  local_view_size: 3  # Smaller view
  mode: baseline
  render_mode: null

agent:
  agent_type: all
  learning_rate: 0.001  # Faster learning
  gamma: 0.99
  n_steps: 256  # Smaller batches
  batch_size: 32
  n_epochs: 5
  clip_range: 0.2
  ent_coef: 0.01
  planning_horizon: 3  # Multi-step planning (fast implementation)
  num_states: 50
  policy_precision: 4.0
  hidden_sizes:
    - 32
    - 32

training:
  total_timesteps: 10000  # Much shorter training
  eval_freq: 2000
  n_eval_episodes: 5
  save_freq: 5000
  log_freq: 500
  seed: 42
  device: auto

test:
  n_trials: 3  # Fewer trials
  baseline_episodes: 10
  test_episodes: 10
  warmup_steps: 20
  blockage_step: 50
  post_blockage_steps: 50
  training_episodes: 20
  transfer_episodes: 10
