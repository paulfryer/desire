# DESIRE Research - Docker Compose Configuration
# Provides multi-container setup for different workflows

version: '3.8'

services:
  # Main research container for full reproduction
  research:
    build:
      context: .
      dockerfile: Dockerfile
    image: desire-research:latest
    container_name: desire-research
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    environment:
      - DESIRE_SEED=42
      - PYTHONPATH=/app
    command: bash scripts/reproduce_all.sh

  # Training service - trains all agents
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: desire-research:latest
    container_name: desire-train
    volumes:
      - ./outputs:/app/outputs
    environment:
      - DESIRE_SEED=42
    command: python experiments/train_agents.py --config experiments/configs/publication_rigorous.yaml

  # Testing service - runs all predicate tests
  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: desire-research:latest
    container_name: desire-test
    volumes:
      - ./outputs:/app/outputs
    environment:
      - DESIRE_SEED=42
    depends_on:
      - train
    command: python experiments/run_tests.py --agents-dir outputs/agents --output outputs/test_results

  # Analysis service - generates publication analysis
  analyze:
    build:
      context: .
      dockerfile: Dockerfile
    image: desire-research:latest
    container_name: desire-analyze
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      - test
    command: >
      sh -c "
        python experiments/analyze_results.py --results outputs/test_results.json &&
        python experiments/generate_publication_analysis.py --results outputs/test_results.json &&
        python experiments/run_extended_analysis.py --test-results outputs/test_results.json
      "

  # Figure generation service
  figures:
    build:
      context: .
      dockerfile: Dockerfile
    image: desire-research:latest
    container_name: desire-figures
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      - analyze
    command: python scripts/generate_figures.py --results outputs/test_results.json --output outputs/figures

  # Interactive dashboard (optional)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: desire-research:latest
    container_name: desire-dashboard
    volumes:
      - ./outputs:/app/outputs
    ports:
      - "8501:8501"
    command: streamlit run src/visualization/dashboard.py --server.address 0.0.0.0

  # Development container with shell access
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: desire-research:latest
    container_name: desire-dev
    volumes:
      - .:/app
      - ./outputs:/app/outputs
    environment:
      - DESIRE_SEED=42
    stdin_open: true
    tty: true
    command: bash

# Named volumes for persistent storage
volumes:
  outputs:
    driver: local
