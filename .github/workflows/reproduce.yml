# DESIRE Research - Reproducibility CI
#
# This workflow verifies that all experiments can be reproduced
# from scratch on a clean environment.

name: Reproducibility Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_reproduction:
        description: 'Run full reproduction (slow)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  DESIRE_SEED: 42

jobs:
  # Quick tests to validate code quality
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ experiments/ tests/

      - name: Type check (optional)
        continue-on-error: true
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports || true

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short -x

  # Quick reproduction check (reduced trials)
  quick-reproduce:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Create quick test config
        run: |
          mkdir -p experiments/configs
          cat > experiments/configs/quick_test.yaml << 'EOF'
          experiment:
            name: quick_ci_test
            seed: 42
          agents:
            - type: heuristic
            - type: rl_ppo
              training:
                total_timesteps: 1000
            - type: active_inference
          tests:
            n_trials: 3
            n_episodes: 5
          EOF

      - name: Train agents (quick)
        run: |
          python experiments/train_agents.py \
            --config experiments/configs/quick_test.yaml \
            --output-dir outputs/agents
        timeout-minutes: 10

      - name: Run predicate tests (quick)
        run: |
          python experiments/run_tests.py \
            --config experiments/configs/quick_test.yaml \
            --model-dir outputs/agents \
            --output-dir outputs/test_results
        timeout-minutes: 20

      - name: Verify outputs exist
        run: |
          test -f outputs/test_results/test_results.json
          echo "Test results generated successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quick-results
          path: outputs/
          retention-days: 7

  # Full reproduction (only on manual trigger or main branch)
  full-reproduce:
    runs-on: ubuntu-latest
    needs: quick-reproduce
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.full_reproduction == 'true' ||
      github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,notebooks,tracking]"

      - name: Run full reproduction
        run: |
          chmod +x scripts/reproduce_all.sh
          ./scripts/reproduce_all.sh --output outputs/full_reproduction
        timeout-minutes: 120

      - name: Generate figures
        run: |
          python scripts/generate_figures.py \
            --results outputs/full_reproduction/test_results/test_results.json \
            --output outputs/full_reproduction/figures

      - name: Verify all outputs
        run: |
          # Check main outputs
          test -f outputs/full_reproduction/test_results/test_results.json
          test -f outputs/full_reproduction/test_results/publication_analysis.html
          test -f outputs/full_reproduction/test_results/raw_data.csv

          # Check figures
          test -f outputs/full_reproduction/figures/figure1_agent_comparison.pdf
          test -f outputs/full_reproduction/figures/figure2_anticipatory_activation.pdf

          echo "All outputs verified successfully"

      - name: Upload full results
        uses: actions/upload-artifact@v4
        with:
          name: full-reproduction-results
          path: outputs/full_reproduction/
          retention-days: 30

  # Docker build verification
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: desire-research:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker container
        run: |
          docker run --rm desire-research:test python -c "
          import numpy as np
          import scipy
          import gymnasium
          from src.agents import HeuristicAgent, RLAgent, BaseAgent
          from src.environments.foraging_grid import ForagingGridEnv
          print('All imports successful')
          "

  # Summary job
  summary:
    runs-on: ubuntu-latest
    needs: [lint-and-test, quick-reproduce, docker-build]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ]; then
            echo "Lint and test failed"
            exit 1
          fi
          if [ "${{ needs.quick-reproduce.result }}" != "success" ]; then
            echo "Quick reproduction failed"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "Docker build failed"
            exit 1
          fi
          echo "All checks passed!"
